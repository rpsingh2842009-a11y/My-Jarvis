name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Gradle Wrapper & Build
      run: |
        gradle init --type basic --script-type groovy --dsl groovy --force
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
